version: '3.8'

services:
  # The Target application (World Monitor)
  world-monitor:
    build: 
      context: ./target
      # Needs to be updated based on World Monitor's actual Dockerfile
    ports:
      - "8080:8080"
    networks:
      - argus_net
    # Note: Depending on the target, we may add 'internal: true' to argus_net
    # to guarantee it cannot make outbound requests to production services.

  # Security Assessment Engine (FastAPI)
  argus-engine:
    build:
      context: ./backend
      # We will create this Dockerfile in the next steps
    environment:
      - TARGET_URL=http://world-monitor:8080
      - DATABASE_URL=postgresql://argus:argus@postgres:5432/argus
      # Hard guard for authorized targets only
      - ALLOWED_TARGET_NETWORKS=argus_net,127.0.0.0/8,172.16.0.0/12,::1/128
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./contracts:/app/contracts
      - ./evidence:/app/evidence
      - ./reports:/app/reports
      - ./target:/app/target:ro # Read-only access to source code for AST analysis
    depends_on:
      - world-monitor
      - postgres
    networks:
      - argus_net

  # Security Twin and Evidence Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=argus
      - POSTGRES_PASSWORD=argus
      - POSTGRES_DB=argus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - argus_net

  # Mock server to stub upstream providers
  mock-server:
    image: mockserver/mockserver:latest
    ports:
      - "1080:1080"
    networks:
      - argus_net

volumes:
  postgres_data:

networks:
  argus_net:
    driver: bridge
    internal: true # STRICT ISOLATION: No internet egress allowed
